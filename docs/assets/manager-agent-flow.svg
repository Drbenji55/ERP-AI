<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Manager Agent workflow architecture</title>
  <desc id="desc">Telegram messages pass through an owner check to an AI manager agent. The agent is connected to a language model, memory, policy retrieval, and Airtable tools.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10172b"/>
      <stop offset="1" stop-color="#121e2c"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0l10 5-10 5z" fill="#7582aa"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0l10 5-10 5z" fill="#31c8b6"/>
    </marker>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect width="1200" height="690" rx="24" fill="url(#panel)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="54" y="62" fill="#fff" font-size="28" font-weight="750">Manager Agent — actual exported workflow</text>
    <text x="54" y="92" fill="#9ba8cd" font-size="16">13 n8n nodes · authorization gate · 4 agent tools · per-chat memory</text>

    <g stroke="#7582aa" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M258 190h74"/>
      <path d="M510 190h74"/>
      <path d="M790 190h74"/>
    </g>
    <g filter="url(#shadow)">
      <rect x="54" y="140" width="204" height="100" rx="18" fill="#172a45" stroke="#2f8ec7"/>
      <rect x="332" y="140" width="178" height="100" rx="18" fill="#242244" stroke="#7d70e7"/>
      <rect x="584" y="128" width="206" height="124" rx="20" fill="#2b2453" stroke="#9182ff" stroke-width="2"/>
      <rect x="864" y="140" width="280" height="100" rx="18" fill="#153536" stroke="#31c8b6"/>
    </g>
    <g fill="#fff" font-weight="700" font-size="17">
      <text x="156" y="181" text-anchor="middle">Owner Message</text>
      <text x="156" y="207" text-anchor="middle" fill="#9fd9fa" font-size="14" font-weight="500">Telegram trigger</text>
      <text x="421" y="181" text-anchor="middle">Is Owner?</text>
      <text x="421" y="207" text-anchor="middle" fill="#c6bfff" font-size="14" font-weight="500">Authorization gate</text>
      <text x="687" y="179" text-anchor="middle" font-size="20">Manager Agent</text>
      <text x="687" y="207" text-anchor="middle" fill="#cec8ff" font-size="14" font-weight="500">Reason · choose tool · respond</text>
      <text x="1004" y="181" text-anchor="middle">Send Answer</text>
      <text x="1004" y="207" text-anchor="middle" fill="#9bf1e7" font-size="14" font-weight="500">Telegram reply</text>
    </g>

    <path d="M421 240v73h-92" fill="none" stroke="#e76b78" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="143" y="278" width="186" height="70" rx="16" fill="#3b202c" stroke="#d95b6a"/>
    <text x="236" y="307" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Deny</text>
    <text x="236" y="330" text-anchor="middle" fill="#f1abb3" font-size="13">Unauthorized sender</text>

    <text x="54" y="410" fill="#fff" font-size="21" font-weight="700">Agent capabilities</text>
    <path d="M687 252v87" fill="none" stroke="#31c8b6" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <path d="M147 466v-72h918v72" fill="none" stroke="#54617f" stroke-width="2"/>
    <path d="M365 466v-72M583 466v-72M801 466v-72" stroke="#54617f" stroke-width="2"/>

    <g filter="url(#shadow)">
      <rect x="54" y="466" width="186" height="116" rx="18" fill="#1c2841" stroke="#526da5"/>
      <rect x="272" y="466" width="186" height="116" rx="18" fill="#1c2841" stroke="#526da5"/>
      <rect x="490" y="466" width="186" height="116" rx="18" fill="#143435" stroke="#2bb6a6"/>
      <rect x="708" y="466" width="186" height="116" rx="18" fill="#352942" stroke="#a875cb"/>
      <rect x="926" y="466" width="218" height="116" rx="18" fill="#352942" stroke="#a875cb"/>
    </g>
    <g text-anchor="middle">
      <text x="147" y="505" fill="#fff" font-size="16" font-weight="700">Chat Model</text>
      <text x="147" y="531" fill="#aebce0" font-size="13">OpenAI-compatible</text>
      <text x="147" y="552" fill="#7180aa" font-size="12">language model</text>
      <text x="365" y="505" fill="#fff" font-size="16" font-weight="700">Chat Memory</text>
      <text x="365" y="531" fill="#aebce0" font-size="13">12-message window</text>
      <text x="365" y="552" fill="#7180aa" font-size="12">keyed by chat ID</text>
      <text x="583" y="505" fill="#fff" font-size="16" font-weight="700">Policy RAG</text>
      <text x="583" y="531" fill="#9ceadd" font-size="13">search_policies</text>
      <text x="583" y="552" fill="#5ea99f" font-size="12">embeddings + vector store</text>
      <text x="801" y="505" fill="#fff" font-size="16" font-weight="700">Search Tools</text>
      <text x="801" y="531" fill="#dfbdea" font-size="13">invoices · tasks</text>
      <text x="801" y="552" fill="#997aa6" font-size="12">Airtable read access</text>
      <text x="1035" y="505" fill="#fff" font-size="16" font-weight="700">Create Task</text>
      <text x="1035" y="531" fill="#dfbdea" font-size="13">structured `$fromAI()` input</text>
      <text x="1035" y="552" fill="#997aa6" font-size="12">Airtable write access</text>
    </g>
    <rect x="54" y="622" width="1090" height="34" rx="17" fill="#18223b"/>
    <circle cx="75" cy="639" r="5" fill="#31c8b6"/>
    <text x="91" y="644" fill="#aab6d6" font-size="13">Diagram generated from the workflow JSON in this repository; it is not a screenshot of another project.</text>
  </g>
</svg>
